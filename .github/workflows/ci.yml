name: SocialRadar CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: socialradar-v0.1/apps/api
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: socialradar
          POSTGRES_USER: socialradar
          POSTGRES_PASSWORD: socialradar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U socialradar -d socialradar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m compileall app
      - run: pytest -q
      - run: python -m app.seed
        env:
          DATABASE_URL: postgresql+psycopg://socialradar:socialradar@localhost:5432/socialradar
      - run: python -c "from app.main import app; print(app.title, app.version)"
        env:
          DATABASE_URL: postgresql+psycopg://socialradar:socialradar@localhost:5432/socialradar

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: socialradar-v0.1/apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
      - run: npm install
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
