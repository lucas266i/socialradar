services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: socialradar
      POSTGRES_USER: socialradar
      POSTGRES_PASSWORD: socialradar
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U socialradar -d socialradar"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - socialradar_pg:/var/lib/postgresql/data

  seed:
    build:
      context: ./apps/api
    environment:
      DATABASE_URL: postgresql+psycopg://socialradar:socialradar@db:5432/socialradar
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "-m", "app.seed"]
    restart: "no"

  api:
    build:
      context: ./apps/api
    environment:
      DATABASE_URL: postgresql+psycopg://socialradar:socialradar@db:5432/socialradar
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ./apps/web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  socialradar_pg:
